name: Build installers

on:
  workflow_dispatch:
  push:
    branches:
      - "main"

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies with retry
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm install --no-audit --no-fund
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Install attempt $attempt failed; retrying..."
            Start-Sleep -Seconds (10 * $attempt)
          }
          exit 1
      - name: Test
        run: npm run check && npm test
      - name: Build EXE installer with retry
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            npm run dist:win
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Build attempt $attempt failed; retrying..."
            Start-Sleep -Seconds (10 * $attempt)
          }
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: Meeting-Notes-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 30

  mac:
    name: macOS ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple-Silicon
            runner: macos-15
          - name: Intel
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies with retry
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm install --no-audit --no-fund; then exit 0; fi
            echo "Install attempt $attempt failed; retrying..."
            sleep $((10 * attempt))
          done
          exit 1
      - name: Test
        run: npm run check && npm test
      - name: Build DMG installer with retry
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run dist:mac; then exit 0; fi
            echo "Build attempt $attempt failed; retrying..."
            sleep $((10 * attempt))
          done
          exit 1
      - name: Verify ad-hoc signature
        shell: bash
        run: |
          app_path="$(find dist -maxdepth 2 -type d -name '*.app' -print -quit)"
          test -n "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          codesign -dv --verbose=4 "$app_path" 2>&1 | grep -q 'Signature=adhoc'
          codesign -d --entitlements :- "$app_path" 2>&1 | grep -q 'com.apple.security.cs.disable-library-validation'
      - uses: actions/upload-artifact@v4
        with:
          name: Meeting-Notes-macOS-${{ matrix.name }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 30

  package-release:
    name: Package release files
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Create combined and source archives
        shell: bash
        run: |
          mkdir -p bundle release
          cp installers/*.exe installers/*.dmg bundle/
          printf '%s\n' \
            'Сводка созвона 1.2.0' \
            '' \
            'Windows: запустите EXE и следуйте обычному мастеру установки.' \
            'macOS Apple Silicon: используйте DMG arm64.' \
            'macOS Intel: используйте DMG x64.' \
            '' \
            'В этой версии: несколько MP4 за один запуск, автоматическое разделение разных созвонов, улучшенное определение имён, подробные сводки и восстановление после сетевого сбоя.' \
            > bundle/README.txt
          (cd bundle && zip -r ../release/Meeting-Notes-1.2.0-Windows-and-macOS.zip .)
          git archive --format=zip --output=release/Meeting-Notes-1.2.0-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: Meeting-Notes-1.2.0-all
          path: release/Meeting-Notes-1.2.0-Windows-and-macOS.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Meeting-Notes-1.2.0-source
          path: release/Meeting-Notes-1.2.0-source.zip
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish v1.2.0 release
    needs: [windows, mac, package-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Publish permanent GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release-files/* --clobber
          else
            gh release create "$tag" release-files/* \
              --target "$GITHUB_SHA" \
              --title "Сводка созвона $tag" \
              --notes 'Несколько MP4 за один запуск, автоматическое разделение разных созвонов, улучшенное определение имён, подробные сводки и восстановление после сетевого сбоя.'
          fi
